<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <title>MaterialForm</title>
</head>
<body>
    <h1>Material</h1>
    <form method="post" action="/materials/save">
        <input type="hidden" name="id" value="{{.Material.Id}}">
        <!--  -->
        <label>
            Name:
            <input type="text" name="material_name"
                value="{{.Material.MaterialName}}" required>
        </label>

        <label>
            Type:
            <select name="material_type_id" required>
                {{range .Types}}
                <option value="{{.Id}}"
                    {{if eq .Id $.Material.MaterialTypeId}}selected{{end}}>
                    {{.Name}}

                </option>
                {{end}}
              
            </select>    
        </label>
        <!--  -->
          <label>
            Price:
            <input type="number" name="price"
                value="{{.Material.Price}}"
                min="0" step="0.01" required>
          </label>

          <label>
            Unit:
            <input type="text" name="items_type"
                value="{{.Material.ItemsType}}"
                maxlength="10" required>
          </label>

          <label>
            Quantity per package:
            <input type="number" name="items_per_package"
                 value="{{.Material.ItemsPerPackage}}"
                 min="0.01" step="0.01" required>
                </label>

          <label>
            In stock
            <input type="number" name="amount"
                value="{{.Material.Amount}}"
                min="0" step="0.01" required>
          </label>


          <label>
            Minimum quantity:
            <input type="number" name="min_amount"
                value="{{.Material.MinAmount}}"
                min="0" step="0.01" required>
          </label>
              <button type="submit">Save</button>
                <a href="/">Back</a>
    </form>
</body>
</html>
