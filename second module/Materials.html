<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materials</title>
      <style>
        body{
            font-family: Georgia, 'Times New Roman', Times, serif;
            background-color: #FFFFFF;
        }
        .material-card{
            background-color: #F4E6D4;
            padding: 16px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            color: #8A5A44;
        }
    </style>
</head>
<body>
    <h1>Materials</h1>

    {{range .}}
    <div class="material-card">
        <div>
            <h2> {{.MaterialType}} | {{.MaterialName}} </h2>
            <p>Price {{.Price}}</p>
            <p>MinAmount {{.MinAmount}} {{.ItemsType}}</p>
            <p>On stash {{.Amount}} {{.ItemsType}}</p>
        </div>
            <p>Required cost: {{printf "%.2f" .RequiredCost}}</p>
    </div>
    {{end}}
</body>
</html>
