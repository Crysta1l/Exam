<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <title>Продукция для материала</title>
</head>
<body>
    <h1>Продукция для материала</h1>
    <h2>{{.Material.MaterialName}}</h2>
    <a href="/">Назад к материалам</a>

    <div class="table-scroll">
        <table>
            <tr>
                <th>Наименование продукции</th>
                <th>Количество материала на единицу продукции</th>
            </tr>
            {{range .Products}}
            <tr>
                <td>{{.Name}}</td>
                <td>{{.MaterialAmount}} {{$.Material.ItemsType}}</td>
            </tr>
            {{else}}
            <tr>
                <td colspan="2">Этот материал пока не используется в продукции.</td>
            </tr>
            {{end}}
        </table>
    </div>
</body>
</html>
